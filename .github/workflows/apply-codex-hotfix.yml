name: Apply Codex hotfix

on:
  push:
    branches:
      - codex

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'Apply temporary hotfix workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out codex branch
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Apply hitbox and parallax fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game.js')
          text = path.read_text(encoding='utf-8')

          old_hitbox = '''  function playerHitbox() {
            return {
              x: player.x - player.w * 0.27,
              y: player.y - player.h * 0.22,
              rx: player.w * 0.27,
              ry: player.h * 0.22,
            };
          }
          '''
          new_hitbox = '''  function playerHitbox() {
            return {
              x: player.x,
              y: player.y,
              rx: player.w * 0.27,
              ry: player.h * 0.22,
            };
          }
          '''

          old_parallax = '''    for (const key of ["far", "mid", "foreground"]) {
              const rate = { far: 0.2, mid: 0.42, foreground: 0.78 }[key];
              game.parallax[key] =
                (game.parallax[key] + game.worldSpeed * rate * dt) % W;
            }
          '''
          new_parallax = '''    for (const key of ["far", "mid", "foreground"]) {
              const rate = { far: 0.2, mid: 0.42, foreground: 0.78 }[key];
              game.parallax[key] += game.worldSpeed * rate * dt;
            }
          '''

          if old_hitbox not in text:
              raise SystemExit('Expected playerHitbox block not found; refusing to make an unsafe edit.')
          if old_parallax not in text:
              raise SystemExit('Expected parallax update block not found; refusing to make an unsafe edit.')

          text = text.replace(old_hitbox, new_hitbox, 1)
          text = text.replace(old_parallax, new_parallax, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and diff
        run: |
          node --check game.js
          git diff --check
          git diff -- game.js

      - name: Commit fix back to existing codex branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Fix hitbox alignment and parallax wrapping"
          git push origin HEAD:codex
